name: IPTV Check

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */12 * * *'

jobs:
  check:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - run: pip install requests

    - run: python check.py

    - run: |
        git config user.name github-actions
        git config user.email action@github.com
        git add cleaned.m3u
        git commit -m "update" || exit 0
        git push
