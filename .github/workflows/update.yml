name: IPTV Cleaner

# 定时任务已停用：海外 runner 受地域限制，
# 大量国内频道无法连通导致误杀，
# 日常检测改由本机 Windows 任务计划执行（run_local.ps1），
# 此处保留手动触发作为备用
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-cleaner
  cancel-in-progress: false

jobs:

  build:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Checker
        run: |
          python -u check.py

      - name: Verify
        run: |
          test -f cleaned.m3u
          wc -l cleaned.m3u

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cleaned.m3u

          git diff --cached --quiet && exit 0

          git commit -m "update m3u"

      - name: Push
        run: git push
